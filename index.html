<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Educatieve Apps</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            max-width: 600px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }

        p {
            color: var(--text-light);
            font-size: 1.1rem;
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 900px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.3rem;
        }

        .card p {
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .btn {
            display: inline-block;
            text-align: center;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <header>
        <h1>Mijn Educatieve Apps</h1>
        <p>Een verzameling van interactieve tools en oefeningen.</p>
    </header>

    <main class="grid">

        <!-- KAART 1: DEELTAFELS -->
        <section class="card">
            <div>
                <h2>Deeltafels met hulp</h2>
                <p>Oefen de deeltafels op een interactieve manier met handige visuele ondersteuning.</p>
            </div>
            <a href="deeltafels/" class="btn">Open App</a>
        </section>

        <!-- SPREEKWOORDELIJKE "NIEUWE APP" (Kopieer dit blok als je een nieuwe app toevoegt) -->
        <!-- 
        <section class="card">
            <div>
                <h2>Tafels Oefenen</h2>
                <p>Invoerbeschrijving van je tweede app hier.</p>
            </div>
            <a href="tafels-oefenen/" class="btn">Open App</a>
        </section> 
        -->

    </main>

</body>
</html>
